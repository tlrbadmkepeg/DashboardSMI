r:15,nama:"Persentase pegawai dan pihak eksternal yang diwajibkan menandatangani pakta integritas sesuai ketentuan mencapai 100%.",target:100,targetLabel:"100%",satuan:"%",jenis:"persentase",kelompok:"Sasaran anti penyuapan"},{nomor:16,nama:"Persentase pegawai pada fungsi atau kegiatan yang memiliki risiko penyuapan dan telah mengikuti sosialisasi dan/atau pelatihan anti penyuapan sesuai ketentuan mencapai 100%.",target:100,targetLabel:"100%",satuan:"%",jenis:"persentase",kelompok:"Sasaran anti penyuapan"},{nomor:17,nama:"Persentase kebutuhan aksesibilitas dan akomodasi yang layak bagi peserta pembelajaran yang telah diidentifikasi sesuai ketentuan mencapai 75%.",target:75,targetLabel:"75%",satuan:"%",jenis:"persentase",kelompok:"Sasaran organisasi pendidikan"},{nomor:18,nama:"Persentase permohonan layanan konsultasi dan pengaduan pelayanan, selain laporan terkait gratifikasi, benturan kepentingan, dan indikasi penyuapan, yang ditindaklanjuti sesuai ketentuan dan standar waktu layanan yang ditetapkan mencapai paling sedikit 90%.",target:90,targetLabel:"\u2265 90%",satuan:"%",jenis:"persentase",kelompok:"Sasaran mutu"}],Ht={kode:"PM.SMI.L1.2026",tujuan:["Pernyataan ruang lingkup ini menetapkan batas organisasi, proses, produk dan layanan, lokasi dan media penerapan, serta keterkaitan persyaratan standar yang menjadi dasar Sistem Manajemen Integrasi (SMI) Badan Pengembangan Sumber Daya Manusia Perdagangan (BPSDMP). Penetapan ruang lingkup mempertimbangkan mandat dan kewenangan organisasi, isu internal dan eksternal, kebutuhan dan harapan pemangku kepentingan yang relevan, persyaratan peraturan perundang-undangan, risiko dan peluang, risiko penyuapan, karakteristik pendidikan dan pembelajaran, serta proses yang berada dalam kendali BPSDMP.","Pernyataan ini merupakan informasi terdokumentasi yang digunakan sebagai acuan penerapan, audit internal, Tinjauan Manajemen, komunikasi ruang lingkup kepada pihak yang relevan, dan penetapan lingkup sertifikasi. Pernyataan ruang lingkup tidak menggantikan ketentuan organisasi dan tata kerja, standar teknis, statuta, standar pelayanan, atau ketentuan peraturan perundang-undangan yang berlaku."],pernyataan:"Penyelenggaraan pengembangan sumber daya manusia perdagangan yang mencakup pengembangan kompetensi aparatur dan nonaparatur; pengembangan sumber daya manusia ekspor, metrologi legal, mutu, dan jasa perdagangan bagi dunia usaha dan masyarakat; pembinaan jabatan fungsional perdagangan dan penilaian kompetensi; pendidikan vokasi di bidang metrologi dan instrumentasi; serta proses manajemen, administrasi, dukungan, evaluasi, peningkatan, dan pengendalian anti penyuapan yang terkait pada seluruh unit kerja BPSDMP.",catatanPernyataan:"Pernyataan di atas merupakan ruang lingkup internal SMI BPSDMP. Redaksi pada sertifikat dapat diringkas atau disesuaikan untuk masing-masing standar berdasarkan hasil audit dan keputusan lembaga sertifikasi, tetapi tidak boleh memperluas atau mengurangi batas organisasi, proses, produk dan layanan tanpa persetujuan BPSDMP melalui pengendalian perubahan yang berlaku.",batasOrganisasi:"Batas organisasi SMI mencakup sepuluh unit kerja. Personel, proses, fasilitas, informasi terdokumentasi, transaksi, dan kerja sama yang berada dalam kewenangan unit termasuk dalam pengendalian SMI sesuai relevansinya. Penyedia eksternal dan rekan bisnis tidak menjadi bagian dari batas organisasi BPSDMP; namun proses, produk, atau jasa yang mereka sediakan dan dapat memengaruhi kesesuaian layanan, integritas, atau hasil pendidikan dikendalikan oleh BPSDMP secara proporsional berdasarkan persyaratan dan risiko.",kelompokProses:[["Manajemen dan tata kelola","Penetapan konteks, arah, kebijakan dan sasaran; perencanaan; manajemen risiko dan peluang; penilaian risiko penyuapan; kepatuhan; pengendalian perubahan; pengelolaan sumber daya; komunikasi; pemantauan kinerja; audit internal; Tinjauan Manajemen; tindakan korektif; dan peningkatan."],["Pengembangan kompetensi aparatur","Kebijakan teknis, perencanaan program, pengembangan kompetensi kepemimpinan/manajerial dan teknis, manajemen pengetahuan, pelatihan aparatur, pembelajaran tatap muka/daring/bauran, asesmen/evaluasi, dan penerbitan bukti hasil layanan sesuai ketentuan."],["Pengembangan SDM dunia usaha dan masyarakat","Pengembangan SDM ekspor, metrologi legal, mutu, dan jasa perdagangan; pelatihan/pengembangan kompetensi nonaparatur; promosi, kerja sama, pembinaan lembaga, pendampingan pelaku usaha, evaluasi, dan penerbitan bukti hasil layanan sesuai ketentuan."],["Pembinaan jabatan fungsional dan penilaian kompetensi","Kebijakan teknis, standar kompetensi, rencana pengembangan kompetensi fungsional, rekomendasi formasi, akreditasi pelaksanaan uji kompetensi, penilaian kompetensi jabatan nonmanajerial, pertimbangan pengangkatan, pembinaan profesi, fasilitasi tugas jabatan fungsional, konsultasi dan layanan informasi."],["Pendidikan vokasi","Perencanaan dan pelaksanaan pendidikan vokasi; pengembangan kurikulum/pembelajaran; asesmen dan dokumen akademik; penelitian dan pengabdian kepada masyarakat; penjaminan mutu; layanan kemahasiswaan; perpustakaan/laboratorium/workshop; kerja sama, pemagangan, penempatan kerja, dan hubungan alumni."],["Proses pendukung","Perencanaan dan anggaran, keuangan, SDM, organisasi dan tata laksana, hukum, data dan informasi, teknologi informasi, BMN, pengadaan, sarana/prasarana, persuratan, kearsipan, komunikasi, keamanan informasi, kerja sama, layanan umum, dan dukungan lain sesuai kewenangan."],["Evaluasi dan peningkatan","Pemantauan sasaran dan proses; kepuasan pengguna/peserta; evaluasi pembelajaran dan dampak; evaluasi penyedia eksternal; audit; Tinjauan Manajemen; keluhan/pengaduan/banding sesuai relevansi; ketidaksesuaian, tindakan korektif, inovasi, dan peningkatan berkelanjutan."],["Pengendalian anti penyuapan","Penilaian risiko penyuapan; uji kelayakan sesuai kebutuhan; pengendalian keuangan dan nonkeuangan; benturan kepentingan; hadiah, jamuan, donasi/sponsorship dan manfaat serupa; komitmen anti penyuapan pihak terkait; mekanisme pelaporan; perlindungan pelapor; investigasi dan penanganan dugaan penyuapan."]],produk:["program, kurikulum, silabus, modul, bahan ajar, media, sumber belajar, dan informasi program;","pelatihan, pengembangan kompetensi aparatur dan nonaparatur, pendidikan vokasi, pembelajaran daring/bauran, pendampingan, konsultasi, pemagangan, dan layanan pembelajaran lain sesuai kewenangan;","hasil asesmen/evaluasi, sertifikat pelatihan atau pengembangan kompetensi, Surat Keterangan Lulus/Surat Pemberitahuan Tidak Lulus, dokumen kelulusan dan dokumen akademik, serta hasil RPL apabila diterapkan sesuai ketentuan;","kebijakan teknis, standar kompetensi, rekomendasi formasi, hasil penilaian kompetensi, akreditasi pelaksanaan uji kompetensi, informasi dan layanan pembinaan jabatan fungsional;","penelitian, publikasi, pengabdian kepada masyarakat, kerja sama pendidikan/industri, layanan kemahasiswaan, alumni, pemagangan, dan penempatan kerja;","layanan administrasi dan dukungan: perencanaan, anggaran, keuangan, SDM, organisasi, hukum, data/informasi, teknologi informasi, BMN, pengadaan, persuratan, kearsipan, kepatuhan, manajemen risiko, dan layanan umum; serta","produk atau layanan lain yang menjadi kewenangan BPSDMP dan ditetapkan melalui peraturan, keputusan pimpinan, standar pelayanan, perjanjian, atau informasi terdokumentasi yang dikendalikan."],penerimaManfaat:"Penerima manfaat dan pengguna layanan meliputi, sesuai relevansi: aparatur Kementerian Perdagangan dan instansi lain; pejabat/calon pejabat fungsional; peserta pelatihan/pengembangan kompetensi aparatur dan nonaparatur; mahasiswa dan calon mahasiswa; pelaku usaha, UMKM, eksportir dan calon eksportir; pemerintah pusat/daerah; lembaga pendidikan dan pelatihan; organisasi profesi/asosiasi; mitra akademik dan industri; orang tua/wali jika relevan; alumni; pengguna lulusan; unit internal; serta pemangku kepentingan lain yang relevan.",lokasi:[["Sekretariat BPSDMP dan 3 Pusat","Jakarta","Sesuai kedudukan dan kewenangan BPSDMP."],["Balai Pengembangan Kompetensi Perdagangan Padang","Padang, Sumatera Barat","Sumatera, Kepulauan Bangka Belitung, dan Kepulauan Riau."],["Balai Pengembangan Kompetensi Perdagangan Yogyakarta","Yogyakarta, DI Yogyakarta","Jawa, Kalimantan, Bali, dan Nusa Tenggara."],["Balai Pengembangan Kompetensi Perdagangan Makassar","Makassar, Sulawesi Selatan","Sulawesi, Maluku, dan Papua."],["Balai Pelatihan Aparatur Metrologi dan Mutu","Bandung Barat, Jawa Barat","Seluruh wilayah Indonesia."],["Balai Pelatihan SDM Metrologi, Mutu, dan Jasa Perdagangan","Bandung Barat, Jawa Barat","Seluruh wilayah Indonesia."],["Akademi Metrologi dan Instrumentasi","Kabupaten Sumedang, Jawa Barat","Sesuai kedudukan dan penyelenggaraan pendidikan vokasi."]],media:"SMI juga berlaku pada fasilitas dan media resmi yang digunakan untuk pelaksanaan proses, termasuk ruang pelayanan, ruang kelas, asrama apabila digunakan, perpustakaan, laboratorium, workshop, ruang asesmen, sarana praktik, lokasi kegiatan sementara atau pemagangan yang dikendalikan melalui ketentuan/perjanjian, serta sistem digital seperti LMS, aplikasi, situs web, sistem akademik, sistem asesmen, basis data, dan media komunikasi resmi. Metode layanan dapat berupa tatap muka, daring, bauran, sinkron, asinkron, praktik, berbasis tempat kerja, pemagangan, pendampingan, atau konsultasi sesuai karakter layanan.",penerapanStandar:[["SNI ISO 9001:2015 dan SNI ISO 9001:2015 Amd.1:2024","Diterapkan pada seluruh sepuluh unit kerja dan proses yang memengaruhi kemampuan BPSDMP menyediakan produk dan layanan secara konsisten sesuai persyaratan serta meningkatkan kepuasan pengguna. Persyaratan desain dan pengembangan diterapkan pada proses yang merancang atau mengubah program, kurikulum, asesmen, produk, layanan, metode, atau sistem."],["SNI ISO 37001:2025","Diterapkan pada seluruh sepuluh unit kerja dan aktivitas dalam batas organisasi, termasuk keputusan, transaksi, pengadaan, pembayaran, asesmen, kerja sama, penggunaan fasilitas, serta hubungan dengan rekan bisnis yang relevan dengan aktivitas dalam ruang lingkup. Bentuk dan tingkat pengendalian ditetapkan secara wajar dan proporsional berdasarkan penilaian risiko penyuapan."],["SNI ISO 21001:2025","Diterapkan pada proses pendidikan dan pembelajaran serta proses manajemen dan pendukung yang memengaruhi mutu, efektivitas, aksesibilitas, pemenuhan kebutuhan peserta/pembelajar, dan hasil pendidikan. Sekretariat dan unit pendukung termasuk sejauh prosesnya mendukung atau memengaruhi penyelenggaraan pendidikan/pembelajaran dalam ruang lingkup."]],penyediaEksternal:["Proses yang disediakan oleh pihak eksternal tidak mengalihkan tanggung jawab BPSDMP atas kesesuaian produk dan layanan. Narasumber, pengajar, asesor, penguji, mitra pendidikan, penyedia platform, penyedia sarana/fasilitas, penyedia barang/jasa, lokasi pemagangan, lembaga sertifikasi, dan pihak eksternal lain dikendalikan sesuai relevansi berdasarkan persyaratan layanan, kompetensi, kinerja, kontrak/perjanjian, keamanan dan kerahasiaan informasi, integritas, konflik kepentingan, serta risiko mutu, pendidikan, kepatuhan, dan penyuapan.","Antarmuka dengan unit lain di Kementerian Perdagangan, kementerian/lembaga, pemerintah daerah, organisasi profesi, lembaga pendidikan, dunia usaha, asosiasi, dan mitra lainnya dikelola melalui proses bisnis, SOP, perjanjian, penugasan, atau informasi terdokumentasi yang dikendalikan. Batas tanggung jawab, masukan, keluaran, kewenangan, komunikasi, dan rekaman harus dapat ditelusuri."],ketidakberlakuan:["Pada saat pernyataan ruang lingkup ini ditetapkan, BPSDMP tidak menetapkan pengecualian umum yang mengurangi kemampuan atau tanggung jawab organisasi untuk memastikan kesesuaian produk dan layanan, efektivitas pendidikan dan pembelajaran, kepatuhan, serta pencegahan penyuapan. Perbedaan karakter layanan antarunit diakomodasi melalui tingkat penerapan dan pengendalian yang relevan pada masing-masing proses.","Apabila suatu persyaratan dinilai tidak berlaku pada ruang lingkup tertentu, penetapan hanya dilakukan apabila diperbolehkan oleh standar yang bersangkutan, memiliki justifikasi terdokumentasi, tidak memengaruhi hasil yang dimaksudkan dari sistem, dan disetujui oleh pihak berwenang. Penilaian tersebut ditinjau kembali apabila terdapat perubahan organisasi, proses, produk/layanan, lokasi, teknologi, pemangku kepentingan, risiko, atau standar.","Rendahnya risiko penyuapan bukan dasar untuk mengeluarkan aktivitas dari penerapan SNI ISO 37001:2025; pengendalian tetap ditetapkan secara proporsional berdasarkan penilaian risiko.","Belum adanya peserta yang membutuhkan akomodasi tertentu pada suatu periode bukan dasar untuk menghilangkan mekanisme identifikasi kebutuhan aksesibilitas dan pemberian akomodasi yang layak.","Persyaratan desain dan pengembangan tetap diterapkan pada proses yang merancang, mengadaptasi, atau mengubah program, kurikulum, asesmen, produk, layanan, metode, atau sistem."],peninjauan:"Ruang lingkup ditinjau sebagai bagian dari Tinjauan Manajemen dan setiap terjadi perubahan yang dapat memengaruhi batas atau penerapan SMI, antara lain perubahan organisasi dan tata kerja, tugas/fungsi, lokasi atau wilayah kerja, produk/layanan, kelompok peserta, teknologi, metode pembelajaran, penyedia eksternal utama, kebutuhan dan harapan pemangku kepentingan, hasil penilaian risiko penyuapan, atau standar yang digunakan. Perubahan ruang lingkup harus melalui analisis dampak, persetujuan Manajemen Puncak, pemutakhiran informasi terdokumentasi terkait, dan komunikasi kepada pihak yang relevan."};var sd=[["SEKRETARIAT","Sekretariat BPSDMP"],["PUS01","Pusat Pengembangan Kompetensi Aparatur Perdagangan (Pusbangkom)"],["PUS02","Pusat Pembinaan Jabatan Fungsional Perdagangan (Pusbin)"],["PUS03","Pusat Pengembangan SDM Ekspor dan Jasa Perdagangan (PPEJP)"],["BAL01","Balai Pengembangan Kompetensi Perdagangan Padang"],["BAL02","Balai Pengembangan Kompetensi Perda "Tata kelola dan dukungan";x();var ai=[["I-01","Evaluasi organisasi dan restrukturisasi","BPSDMP merupakan organisasi baru yang mengonsolidasikan 10 unit kerja dengan riwayat proses, dokumen, dan sistem kerja yang beragam.","W/O","Mutu/AP/OP","Risiko tumpang tindih atau kekosongan pengendalian; peluang penyederhanaan dan integrasi proses.","Menetapkan peta proses, pemilik proses, RACI, SOP lintas unit, dan mekanisme eskalasi.","Sekretariat; Tim SMI; seluruh pimpinan unit","Struktur organisasi, peta proses, SK tim, SOP, hasil evaluasi organisasi"],["I-02","Mandat, jaringan, dan cakupan layanan","Mandat pengembangan SDM perdagangan didukung jaringan pusat, balai wilayah, balai teknis, dan perguruan tinggi pada berbagai lokasi.","S/O","Mutu/OP","Peluang pemerataan akses dan spesialisasi layanan; risiko variasi mutu antarlokasi.","Standardisasi kriteria layanan dan pembelajaran, dashboard kinerja, audit silang, serta berbagi praktik baik.","Kepala BPSDMP; Sekretariat; pimpinan unit","Standar pelayanan, kurikulum, indikator unit, laporan audit dan evaluasi"],["I-03","SDM dan beban kerja","Masih terdapat jabatan yang belum terisi, jumlah dan kompetensi SDM belum merata, serta pembagian beban kerja belum seluruhnya optimal.","W","Mutu/AP/OP","Keterlambatan, ketergantungan pada personel tertentu, lemahnya pemisahan tugas, dan ketidakkonsistenan layanan.","Analisis beban kerja, matriks kompetensi, rencana pemenuhan SDM, redistribusi tugas, dan pengendalian substitusi.","Sekretariat; pimpinan unit","Peta jabatan, ABK, matriks kompetensi, rencana pengembangan SDM"],["I-04","Kompetensi pembelajaran dan digital","Kompetensi pengelolaan LMS, andragogi, desain pembelajaran, asesmen, penulisan ilmiah, dan pengelolaan data belum merata.","W/O","Mutu/OP","Risiko pembelajaran kurang efektif dan bukti tidak andal; peluang peningkatan kapasitas serta standardisasi kompetensi.","TNA, sertifikasi/pelatihan pengajar dan admin LMS, coaching, komunitas praktik, evaluasi efektivitas pelatihan.","Sekretariat; unit penyelenggara pendidikan/pelatihan","TNA, sertifikat, evaluasi pengajar, evaluasi efektivitas pengembangan kompetensi"],["I-05","Akuntabilitas dan mutu data kinerja","Kualitas implementasi SAKIP, integrasi indikator, validasi data, dan ketertelusuran bukti kinerja masih perlu diperkuat.","W/O","Mutu/AP/OP","Keputusan tidak berbasis bukti, pelaporan tidak konsisten, dan sasaran tidak terpantau; peluang dashboard terpadu.","Kamus indikator, penanggung jawab data, validasi berjenjang, dashboard, dan reviu berkala.","Sekretariat; pemilik sasaran; pimpinan unit","Perjanjian kinerja, dashboard, laporan validasi, laporan sasaran SMI"],["I-06","LMS, repository, dan sistem digital","Pengelolaan LMS KUDAGANG, repository pengetahuan, integrasi aplikasi, prosedur operasional, keamanan, dan kontinuitas layanan belum seragam.","W/O","Mutu/AP/OP","Gangguan layanan, kehilangan data, akses tidak sah, serta pengalaman peserta tidak konsisten; peluang pembelajaran skala luas.","Tata kelola aplikasi, SOP, kontrol akses, pencadangan, uji pemulihan, helpdesk, pemantauan kapasitas dan kinerja.","Sekretariat/TI; Pusbangkom; seluruh pengelola aplikasi","SOP, log akses, hasil backup/restore, tiket helpdesk, laporan kinerja LMS"],["I-07","Kurikulum, silabus, dan bahan pembelajaran","Kurikulum/silabus dan bahan pembelajaran belum selalu tersedia tepat waktu atau belum sepenuhnya mengikuti kebutuhan terbaru.","W","Mutu/OP","Program tidak relevan atau tidak konsisten; perubahan tidak terkendali; hasil belajar tidak tercapai.","Siklus pengembangan kurikulum, validasi ahli/pemangku kepentingan, pengesahan perubahan, dan daftar induk bahan.","Unit penyelenggara; penanggung jawab akademik/kurikulum","TNA, kurikulum, silabus, berita acara validasi, daftar perubahan"],["I-08","Pengajar, asesor, penguji, dan objektivitas","Ketersediaan, kompetensi, keseragaman penilaian, independensi, dan potensi benturan kepentingan pengajar/asesor/penguji memerlukan pengendalian konsisten.","W/T","Mutu/AP/OP","Penilaian bias, jadwal terganggu, gratifikasi atau benturan kepentingan, dan keberatan peserta.","Kriteria penugasan, moderasi asesmen, deklarasi benturan kepentingan, evaluasi kinerja, rotasi, dan daftar pengganti.","Unit penyelenggara; Pusbin JF; FKAP","SK penugasan, CV/sertifikat, deklarasi, rubrik, hasil moderasi dan evaluasi"],["I-09","Infrastruktur dan sarana pembelajaran","Kondisi ruang, laboratorium, perangkat praktik, jaringan, fasilitas aksesibilitas, dan sarana pendukung berbeda antarunit dan sebagian masih terbatas.","W/O","Mutu/OP","Praktik tidak optimal, keselamatan/akses terganggu, dan ketidakpuasan peserta; peluang pemanfaatan bersama.","Pemetaan kebutuhan, prioritas investasi, pemeliharaan, kalibrasi/verifikasi, peminjaman bersama, dan rencana alternatif.","Sekretariat; pimpinan UPT/Akmet","Daftar aset, jadwal pemeliharaan/kalibrasi, checklist fasilitas, laporan gangguan"],["I-10","Penelitian, publikasi, dan beban akademik Akmet","Beban kerja dosen, keterampilan penulisan ilmiah, dukungan publikasi, dan jejaring kerja sama penelitian masih perlu diperkuat.","W/O","Mutu/OP","Target tridharma dan pengembangan pengetahuan tidak optimal; peluang peningkatan reputasi dan inovasi.","Pengaturan beban kerja, klinik penulisan, insentif/dukungan publikasi, kolaborasi penelitian, dan repository karya.","Direktur Akmet; unit akademik","BKD, rencana penelitian, publikasi, MoU, laporan pengabdian"],["I-11","Budaya integritas, budaya anti penyuapan, dan pengendalian anti penyuapan","Komitmen integritas telah menjadi nilai organisasi, namun penerapan pakta integritas, deklarasi benturan kepentingan, uji kelayakan, pelaporan, dan tindak lanjut perlu konsisten di seluruh lokasi.","S/W","AP/Mutu/OP","Penyuapan, gratifikasi, penyalahgunaan kewenangan, ketidakpercayaan, dan ketidakefektifan pengendalian.","Komunikasi kebijakan, pelatihan berbasis risiko, pakta integritas, due diligence, kanal pelaporan, perlindungan pelapor, dan pemantauan FKAP.","Kepala BPSDMP; FKAP; pimpinan unit","Pakta integritas, deklarasi, laporan gratifikasi/WBS, hasil uji kelayakan dan tindak lanjut"],["I-12","Dokumen, rekaman, data, dan kekayaan intelektual","Pengendalian versi, retensi, akses, keamanan data peserta, dokumen akademik, soal asesmen, dan kekayaan intelektual perlu terintegrasi.","W","Mutu/AP/OP","Dokumen kedaluwarsa, kebocoran data/soal, kehilangan rekaman, sengketa hak, dan ketertelusuran lemah.","Daftar induk, klasifikasi informasi, hak akses, retensi, backup, persetujuan penggunaan karya, dan audit akses.","Sekretariat; pemilik proses; pengelola TI/arsip","Daftar induk, jadwal retensi, log akses, backup, persetujuan hak cipta"],["I-13","Aksesibilitas dan layanan inklusif","Identifikasi kebutuhan peserta berkebutuhan khusus dan penyediaan akomodasi yang layak belum seluruhnya terstandar pada semua jenis layanan.","W/O","OP/Mutu","Peserta tidak memperoleh akses setara; keluhan dan ketidakpatuhan; peluang perluasan penerima manfaat.","Form identifikasi kebutuhan, standar akomodasi, akses digital, fasilitas fisik, petugas pendamping, dan evaluasi peserta.","Unit penyelenggara; Sekretariat","Form kebutuhan, checklist aksesibilitas, bukti akomodasi, hasil evaluasi"],["I-14","Pengetahuan organisasi dan kesinambungan","Pengetahuan kritis masih tersebar pada personel tertentu; mekanisme lesson learned, suksesi, dan alih pengetahuan belum seragam.","W/O","Mutu/AP/OP","Kehilangan pengetahuan saat mutasi/pensiun, pengulangan kesalahan, dan ketergantungan personel; peluang organisasi pembelajar.","Repository pengetahuan, serah terima, mentoring, dokumentasi praktik baik, dan forum pembelajaran lintas unit.","Sekretariat; pimpinan unit; pemilik proses","Repository, berita acara serah terima, lesson learned, laporan forum praktik baik"]],ei=[["E-01","Politik/kebijakan","Arah pembangunan perdagangan, pengembangan SDM nasional, dan prioritas Kementerian Perdagangan berubah sesuai kebijakan pemerintah.","E","Mutu/OP","Peluang penyelarasan program strategis; risiko program tidak relevan bila respons lambat.","Reviu Renstra/Renja, pemetaan kebutuhan, penyesuaian portofolio program dan sasaran.","Kepala BPSDMP; Sekretariat; pusat terkait","Renstra, Renja, arahan pimpinan, notulen reviu"],["E-02","Hukum/regulasi","Regulasi organisasi, ASN, jabatan fungsional, pendidikan tinggi, pelatihan, metrologi, standardisasi, keuangan, pengadaan, data, dan arsip bersifat dinamis.","E","Mutu/AP/OP","Ketidakpatuhan, dokumen/kurikulum tidak mutakhir, keterlambatan layanan; peluang perbaikan tata kelola.","Register peraturan, legal review, PIC regulasi, sosialisasi, pembaruan dokumen dan kurikulum.","Sekretariat/Hukum; unit teknis","Register peraturan, hasil telaah, bukti sosialisasi, revisi dokumen"],["E-03","Ekonomi/anggaran","Kebijakan efisiensi anggaran dan keterbatasan pembiayaan peserta/instansi pengirim memengaruhi volume, metode, serta jangkauan program.","E","Mutu/OP","Pembatalan/penurunan mutu program; kesempatan model daring, kolaborasi, dan prioritas berbasis risiko.","Prioritas program, desain blended, efisiensi biaya, kerja sama, dan pemantauan biaya per peserta.","Sekretariat; pimpinan unit","RKA, revisi anggaran, analisis biaya, laporan realisasi"],["E-04","Tata kelola publik","Tuntutan reformasi birokrasi, SAKIP, pelayanan publik, keterbukaan informasi, SPIP, dan digitalisasi tata kelola terus meningkat.","E","Mutu/AP","Peluang penguatan akuntabilitas; risiko ketidaksesuaian dan rendahnya kepercayaan publik.","Integrasi indikator, standar pelayanan, publikasi informasi, pengendalian internal, dan evaluasi berkala.","Sekretariat; seluruh unit","LKE, laporan SAKIP/SPIP, standar pelayanan, hasil survei"],["E-05","Kebutuhan kompetensi dan pasar kerja","Kebutuhan kompetensi aparatur, pelaku usaha, tenaga metrologi/mutu, jasa perdagangan, dan pasar kerja berubah cepat.","E","Mutu/OP","Kurikulum dan lulusan tidak relevan; peluang program baru dan peningkatan daya serap lulusan.","Analisis kebutuhan, tracer study, forum industri, reviu kurikulum, microcredential/sertifikasi yang relevan.","Pusat/UPT/Akmet","TNA, tracer study, FGD, kurikulum dan portofolio program"],["E-06","Persaingan dan reputasi","Banyak lembaga pemerintah/swasta menawarkan pelatihan ekspor dan program sejenis; branding pusat keunggulan perlu diperkuat.","E","Mutu/OP","Peserta/mitra beralih; peluang diferensiasi, spesialisasi perdagangan, dan pengakuan mutu.","Strategi branding, benchmarking, publikasi dampak, layanan unggulan, sertifikasi dan kemitraan.","PPEJP; unit layanan; komunikasi publik","Analisis pembanding, media, data peserta, survei citra dan kemitraan"],["E-07","Karakteristik peserta/instansi pengirim","Peserta memiliki tingkat pengetahuan, literasi digital, dukungan atasan, waktu, dan akses pembiayaan yang beragam; sebagian tetap menerima tugas saat pelatihan.","E","Mutu/OP","Ketidakhadiran, putus belajar, hasil tidak merata, dan kepuasan rendah.","Pre-assessment, persyaratan komitmen, orientasi LMS, dukungan tutor, pembelajaran adaptif, komunikasi dengan instansi pengirim.","Unit penyelenggara","Pre-test, surat tugas/komitmen, log kehadiran, data dropout, evaluasi"],["E-08","Teknologi pembelajaran dan AI","Perkembangan LMS, AI, simulasi, proctoring, analitik, dan media digital membuka peluang sekaligus risiko etika, bias, keamanan, serta ketergantungan teknologi.","E","Mutu/AP/OP","Efisiensi dan personalisasi; risiko plagiarisme, kebocoran data, bias asesmen, atau layanan terhenti.","Pedoman penggunaan AI, uji teknologi, verifikasi manusia, kontrol akses, literasi digital, dan rencana kontinuitas.","Sekretariat/TI; unit akademik/pelatihan","Pedoman, hasil uji, log, laporan insiden, evaluasi teknologi"],["E-09","Keamanan siber dan perlindungan data","Ancaman siber, kebocoran data, phishing, dan gangguan layanan digital meningkat.","E","Mutu/AP/OP","Kehilangan/penyalahgunaan data, layanan berhenti, reputasi dan integritas terganggu.","Klasifikasi data, MFA/kontrol akses, backup, awareness, respons insiden, dan pengujian pemulihan.","Pengelola TI; Sekretariat; pemilik data","Log keamanan, backup, hasil simulasi, laporan insiden"],["E-10","Penyedia eksternal, rekan bisnis, dan tenaga ahli","Ketersediaan pengajar, asesor, penguji, narasumber, platform, fasilitas, dan mitra eksternal tidak selalu sesuai jadwal/kriteria.","E","Mutu/AP/OP","Jadwal tertunda, mutu bervariasi, benturan kepentingan dan ketergantungan pihak ketiga.","Kriteria seleksi, evaluasi ulang, daftar cadangan, SLA, uji kelayakan (due diligence) sesuai tingkat risiko penyuapan, klausul integritas, dan pengendalian keluaran.","Unit penyelenggara; pengadaan; FKAP","Daftar penyedia/rekan bisnis, hasil evaluasi, kontrak/SLA, hasil uji kelayakan (due diligence), deklarasi benturan kepentingan, dan bukti tindak lanjut risiko."],["E-11","Kemitraan dan jejaring","Peluang kerja sama dengan industri, pemerintah daerah, perguruan tinggi, asosiasi, organisasi profesi, dan lembaga internasional belum dimanfaatkan merata.","E","Mutu/OP","Peluang akses sumber daya, praktik kerja, riset, peserta, pengajar, dan penyerapan lulusan.","Pemetaan mitra, prioritas kerja sama, target hasil, evaluasi manfaat, pengendalian integritas, serta uji kelayakan (due diligence) terhadap mitra sesuai tingkat risiko penyuapan","Pusat/UPT/Akmet; Sekretariat","Database mitra, MoU/PKS, hasil uji kelayakan apabila dipersyaratkan berdasarkan tingkat risiko, laporan hasil, dan evaluasi manfaat."],["E-12","Integritas dan penegakan antikorupsi","Ekspektasi publik, pengawasan KPK/Itjen, ketentuan gratifikasi, benturan kepentingan, WBS, dan pertanggungjawaban publik semakin kuat.","E","AP/Mutu","Risiko sanksi, reputasi, ketidakpercayaan; peluang budaya integritas dan transparansi.","Pemetaan risiko penyuapan, pelatihan, kanal pelaporan, uji kelayakan, monitoring dan pelaporan kepatuhan.","Kepala BPSDMP; FKAP; Sekretariat","Register risiko penyuapan, laporan gratifikasi/WBS, hasil monitoring"],["E-13","Perubahan iklim dan cuaca ekstrem","Cuaca ekstrem, banjir, longsor, gelombang panas, gangguan transportasi, dan bencana dapat memengaruhi lokasi, perjalanan, fasilitas, kesehatan, dan jadwal kegiatan.","E","Mutu/OP","Pembatalan, keselamatan, kerusakan fasilitas, akses tidak setara; peluang pembelajaran daring dan efisiensi perjalanan.","Penilaian lokasi/jadwal, rencana kontinjensi, opsi daring/bauran, komunikasi darurat, pemeliharaan, dan kontinuitas layanan.","Sekretariat; seluruh penyelenggara/lokasi","Rencana kontinjensi, notifikasi, checklist keselamatan, laporan gangguan"],["E-14","Geografi dan pemerataan akses","Wilayah kerja tersebar dengan kondisi jaringan, transportasi, waktu, bahasa, dan kebutuhan lokal yang berbeda.","E","Mutu/OP","Akses tidak merata dan biaya tinggi; peluang pemanfaatan tiga balai wilayah dan model hybrid.","Pemetaan kebutuhan wilayah, kalender regional, materi adaptif, platform ringan, kemitraan lokal, serta indikator pemerataan.","Bapekomdag; pusat terkait","Peta peserta/wilayah, jadwal regional, data akses dan partisipasi"],["E-15","Standar, sertifikasi, dan akreditasi","Perubahan edisi standar ISO, skema sertifikasi profesi, akreditasi, serta persyaratan lembaga sertifikasi memerlukan transisi terkendali.","E","Mutu/AP/OP","Ketidaksesuaian saat audit/sertifikasi; peluang penguatan sistem dan pengakuan eksternal.","Gap analysis, rencana transisi, pelatihan auditor/personel, harmonisasi dokumen, dan audit kesiapan.","Koordinator SMI; FKAP; unit terkait","Gap analysis, roadmap, bukti pelatihan, laporan audit kesiapan"],["E-16","Kondisi sosial dan ekspektasi layanan","Masyarakat mengharapkan layanan cepat, transparan, ramah, inklusif, mudah diakses, dan responsif terhadap keluhan.","E","Mutu/OP/AP","Keluhan dan penurunan kepercayaan; peluang peningkatan kepuasan dan partisipasi.","Standar layanan, kanal multisaluran, survei, SLA pengaduan, publikasi informasi dan tindak lanjut.","Seluruh unit layanan; Sekretariat","Standar pelayanan, survei, log konsultasi/pengaduan, laporan tindak lanjut"]],Jl=[["Strengths (Kekuatan)","Mandat kelembagaan yang jelas; jaringan 10 unit dan multilokasi; keahlian perdagangan, ekspor, jabatan fungsional, metrologi, mutu, jasa, dan pendidikan vokasi; layanan dari analisis kebutuhan hingga sertifikasi/kelulusan; dukungan nilai BerAKHLAK dan pengalaman sistem mutu di beberapa unit."],["Weaknesses (Kelemahan)","Organisasi baru dan harmonisasi proses belum sepenuhnya matang; kekosongan/ketimpangan SDM; kompetensi digital, andragogi, asesmen, dan penulisan ilmiah belum merata; data, repository, LMS, dokumen, sarana, dan kurikulum belum seragam; pengendalian integritas lintas lokasi perlu konsistensi."],["Opportunities (Peluang)","Permintaan pengembangan kompetensi dan sertifikasi; digital learning, AI, analitik dan hybrid; kemitraan pemerintah, industri, perguruan tinggi, asosiasi dan internasional; pemanfaatan balai wilayah; penguatan center of excellence; tracer study dan program berbasis kebutuhan pasar kerja."],["Threats (Ancaman)","Efisiensi anggaran; perubahan regulasi cepat; persaingan lembaga pelatihan; ancaman siber dan kebocoran data; risiko penyuapan/benturan kepentingan pihak ketiga; perubahan iklim, bencana dan gangguan transportasi; kesenjangan digital dan akses wilayah."]],Vl=[["Penetapan relevansi","Relevan terhadap kesinambungan layanan, keselamatan, aksesibilitas peserta, perjalanan dinas, kondisi fasilitas, jadwal pendidikan/pelatihan, dan ketersediaan infrastruktur digital."],["Proses terdampak","Kegiatan tatap muka/bauran, perjalanan peserta dan pengajar, penggunaan laboratorium, asrama/fasilitas, pengadaan dan logistik, pemeliharaan gedung, jaringan/kelistrikan, jadwal akademik dan pelayanan regional."],["Risiko utama","Penundaan/pembatalan kegiatan; gangguan keselamatan dan kesehatan; kerusakan fasilitas; putusnya jaringan/listrik; biaya meningkat; peserta wilayah tertentu tidak memperoleh akses setara."],["Peluang","Perluasan pembelajaran daring/bauran, pengurangan perjalanan, efisiensi sumber daya, materi pembelajaran yang adaptif, dan peningkatan kesiapsiagaan organisasi."],["Pengendalian minimum","Pemantauan cuaca/peringatan, asesmen lokasi dan jadwal, rencana kontinuitas, opsi daring, komunikasi darurat, prosedur keselamatan, pemeliharaan, backup daya/data, dan evaluasi pascakejadian."]],Gl=["Konteks organisasi","Isu relevan","Risiko/peluang","Tindakan dan sasaran","Pemantauan","Audit/evaluasi","Tinjauan Manajemen","Peningkatan"],de=(e,t,i,l,r,s,o,u,d,p,m,g,c,h,f,v)=>({no:e,nama:t,peran:i,relevansi:l,pengaruh:r,kepentingan:s,prioritas:o,kebutuhan:u,persyaratan:d,risikoPeluang:p,pj:m,media:g,frekuensi:c,strategi:h,indikator:f,pic:v}),At=[de(1,"Menteri Perdagangan dan pimpinan Kementerian","Pemberi arah, mandat, pengawasan, dan pengguna informasi kinerja BPSDMP.","Mutu/AP/OP","Tinggi","Tinggi","A","Pencapaian mandat; dukungan terhadap sasaran kementerian; kinerja efektif, efisien, akuntabel, dan berintegritas; pengendalian risiko; informasi yang andal untuk pengambilan keputusan.","Peraturan organisasi dan tata kerja; Renstra; Perjanjian Kinerja; kebijakan kementerian; ketentuan pelaporan, akuntabilitas, SPIP, dan integritas.","Kinerja tidak selaras atau bukti tidak andal; peluang penguatan tata kelola dan reputasi.","Kepala BPSDMP; Sekretariat BPSDMP","Rapat pimpinan, nota dinas, laporan kinerja, dashboard, Tinjauan Manajemen.","Bulanan/triwulanan/tahunan dan ketika ada isu strategis.","Pelaporan capaian, risiko, kebutuhan keputusan, dan tindak lanjut arahan.","Capaian Perjanjian Kinerja; keputusan pimpinan; status tindak lanjut; laporan SMI.","Kepala BPSDMP; Sekretariat BPSDMP"),de(2,"Unit eselon I dan unit teknis Kementerian Perdagangan","Mitra internal, instansi pengirim, pengguna hasil pengembangan kompetensi, dan sumber kebutuhan program.","Mutu/AP/OP","Tinggi","Tinggi","A","Program pengembangan kompetensi yang relevan; jadwal dan layanan tepat waktu; narasumber/kolaborasi; data peserta dan hasil evaluasi yang dapat digunakan; koordinasi  alat/venue/jasa; konsultasi/pendampingan teknis; evaluasi pembelajaran; penerbitan sertifikat pelatihan.",pj:"Kepala Balai/pemilik layanan/PPK."},komunikasi:{fokus:"Pelatihan, peserta, pengajar, fasilitas praktik, evaluasi, sertifikat pelatihan, konsultasi/pendampingan dan mitra.",penerima:"Peserta, pelaku usaha/instansi, pengajar, mitra teknis",media:"LMS, surat, konsultasi, briefing, media sosial",pj:"Kepala Balai/Pemilik proses/PIC komunikasi"}}],ql=e=>{var t;return(t=Ee.find(i=>i.cocok.test(e)))!=null?t:null},xn={kode:"PM.SMI.L5.2026",prinsip:"Lampiran ini menetapkan hubungan tata kelola penerapan Sistem Manajemen Integrasi (SMI) BPSDMP agar peran, tanggung jawab, kewenangan, koordinasi, pelaporan, independensi, dan akuntabilitas jelas. Bagan ini merupakan bagan tata kelola SMI, bukan struktur organisasi, sehingga tidak mengubah kedudukan dan hubungan pembinaan yang ditetapkan dalam peraturan organisasi dan tata kerja. Penerapannya menekankan akuntabilitas Manajemen Puncak, tanggung jawab Pimpinan Unit dan Pemilik Proses, mutu dan efektivitas pendidikan/pembelajaran, independensi FKAP, objektivitas dan imparsialitas audit internal, serta peningkatan berkelanjutan.",catatanPersonel:"Nama personel dan rincian penugasan dalam tata kelola SMI ditetapkan melalui keputusan dan/atau surat penugasan yang berlaku.",unsur:[{id:"mp",nama:"Manajemen Puncak",komposisi:"Kepala BPSDMP",tanggungJawab:"Akuntabel atas efektivitas SMI; menetapkan ruang lingkup, kebijakan, sasaran, tata kelola dan sumber daya; memastikan integrasi persyaratan; memimpin Tinjauan Manajemen dan budaya mutu/integritas.",pelaporan:"Mengarahkan unsur SMI; menerima laporan kinerja, risiko, audit, tindakan korektif, dan FKAP; mempertanggungjawabkan kinerja sesuai tata kelola Kementerian."},{id:"tim",nama:"Tim SMI BPSDMP",komposisi:"Personel yang ditetapkan sebagai Tim SMI BPSDMP melalui Keputusan Kepala BPSDMP",tanggungJawab:"Mengoordinasikan penerapan, pemeliharaan, evaluasi, dan peningkatan SMI lintas unit; mengonsolidasikan sasaran, risiko dan peluang, informasi terdokumentasi, kompetensi, hasil pemantauan, tindakan korektif, serta bahan Tinjauan Manajemen; tanpa mengambil alih tanggung jawab Pimpinan Unit dan Pemilik Proses.",pelaporan:"Melapor kepada Kepala BPSDMP; berkoordinasi dengan Pimpinan Unit, FKAP, Auditor Internal, dan fungsi pendukung."},{id:"fkap",nama:"Fungsi Kepatuhan Anti Penyuapan (FKAP)",komposisi:"Personel Tim SMI BPSDMP yang ditetapkan untuk menjalankan Fungsi Kepatuhan Anti Penyuapan, dengan kompetensi, kewenangan, sumber daya, status, dan independensi yang memadai.",tanggungJawab:"Mengawasi desain dan penerapan Sistem Anti Penyuapan; memberi petunjuk; memastikan kesesuaian; menilai kecukupan/efektivitas; dan melaporkan kinerja. Keterlibatan investigasi hanya sesuai kewenangan dan bebas benturan kepentingan.",pelaporan:"Memiliki akses langsung kepada Kepala BPSDMP sebagai Manajemen Puncak dalam pelaksanaan dan pelaporan fungsi anti penyuapan; pelaporan tidak boleh dihambat oleh fungsi operasional yang diawasi."},{id:"sekr",nama:"Sekretariat Tim SMI",komposisi:"Personel pendukung yang ditetapkan",tanggungJawab:"Mengelola administrasi rapat, agenda, daftar induk dokumen SMI, distribusi, konsolidasi data, rekaman komunikasi, dokumentasi keputusan, dan dukungan administratif.",pelaporan:"Mendukung Tim SMI BPSDMP dalam pelaksanaan administrasi dan pengelolaan informasi terdokumentasi SMI; tidak mengambil alih kewenangan Manajemen Puncak, Pimpinan Unit, FKAP, Auditor Internal, atau Pemilik Proses."},{id:"pu",nama:"Pimpinan Unit",komposisi:"Sekretaris BPSDMP, Kepala Pusat, Kepala Balai, dan Direktur Akmet sesuai kedudukan masing-masing",tanggungJawab:"Memastikan SMI diterapkan pada proses unit; menyediakan sumber daya; mengelola sasaran, risiko, kompetensi, kepatuhan, evaluasi, peningkatan, dan tindak lanjut temuan.",pelaporan:"Melapor sesuai garis kedudukan OTK; data/informasi SMI disampaikan melalui mekanisme koordinasi yang ditetapkan."},{id:"pp",nama:"Pemilik Proses",komposisi:"Pejabat/personel yang diberi tanggung jawab atas proses utama atau pendukung",tanggungJawab:"Memastikan proses ditetapkan, dilaksanakan, dikendalikan, dipantau, diukur, didokumentasikan, dikelola risikonya, memenuhi persyaratan, dan ditingkatkan.",pelaporan:"Melapor kepada Pimpinan Unit; berkoordinasi dengan pihak lintas unit apabila proses bersifat lintas fungsi."},{id:"ai",nama:"Auditor Internal",komposisi:"Personel yang kompeten, objektif, dan bebas dari tanggung jawab atas pekerjaan yang diaudit",tanggungJawab:"Melaksanakan audit sesuai program; menilai kesesuaian/efektivitas; menyusun temuan/laporan; memverifikasi tindak lanjut. Auditor tidak melaksanakan tindakan korektif area yang diaudit.",pelaporan:"Menyampaikan hasil audit kepada pihak berwenang; menjaga objektivitas, imparsialitas, dan kerahasiaan."},{id:"per",nama:"Seluruh Personel",komposisi:"Pegawai dan pihak yang bekerja untuk/atas nama BPSDMP sesuai relevansi",tanggungJawab:"Menerapkan kebijakan/prosedur; menjaga mutu, integritas, kerahasiaan dan kepatuhan; mengelola risiko; melaporkan masalah/dugaan pelanggaran; berkontribusi pada perbaikan.",pelaporan:"Berkoordinasi melalui atasan/Pemilik Proses dan menggunakan saluran pelaporan yang ditetapkan, termasuk saluran anti penyuapan bila relevan."}],alur:[["Arah dan Penetapan","Kepala BPSDMP sebagai Manajemen Puncak menetapkan arah, ruang lingkup, kebijakan, sasaran, tata kelola, serta sumber daya yang diperlukan untuk penerapan dan peningkatan SMI BPSDMP."],["Koordinasi dan Konsolidasi","Tim SMI BPSDMP mengoordinasikan penerapan, pemeliharaan, pemantauan, evaluasi, pelaporan, dan peningkatan SMI lintas unit dengan dukungan Sekretariat Tim SMI."],["Pelaksanaan pada Unit","Pimpinan Unit memastikan penerapan SMI pada unit masing-masing melalui Pemilik Proses dan seluruh personel sesuai tugas, fungsi, kewenangan, serta tanggung jawab yang ditetapkan."],["Pengawasan Anti Penyuapan","FKAP menjalankan fungsi pengawasan terhadap desain dan penerapan pengendalian anti penyuapan, memberikan saran dan panduan, memantau kesesuaian dan efektivitas sistem anti penyuapan, serta menyampaikan hasil tinjauan dan laporan secara langsung kepada Manajemen Puncak sesuai kewenangannya."],["Audit Internal","Auditor Internal melaksanakan audit secara objektif dan tidak mengaudit pekerjaan yang menjadi tanggung jawabnya sendiri. Temuan disampaikan melalui laporan audit dan ditindaklanjuti oleh Pemilik Proses/Pimpinan Unit."],["Pelaporan dan Tinjauan","Kinerja proses, pencapaian sasaran, kepuasan pengguna/peserta, hasil dan efektivitas pendidikan/pembelajaran, risiko dan peluang, risiko penyuapan, keluhan/pengaduan, hasil audit, tindakan korektif, serta hasil tinjauan FKAP dikonsolidasikan sebagai masukan Tinjauan Manajemen dan dasar pengambilan keputusan."],["Peningkatan","Keputusan dan hasil evaluasi ditindaklanjuti melalui koreksi, tindakan korektif, perubahan pengendalian, penyediaan sumber daya, pembaruan risiko/dokumen, inovasi, dan peningkatan berkelanjutan."]],peninjauan:"Struktur tata kelola SMI ditinjau apabila terjadi perubahan organisasi dan tata kerja, peraturan perundang-undangan, ruang lingkup SMI, standar yang diterapkan, penetapan personel/tim, hasil audit, Tinjauan Manajemen, risiko penyuapan, atau kondisi lain yang memengaruhi efektivitas, independensi, kewenangan, dan akuntabilitas. Perubahan ditetapkan melalui mekanisme pengendalian informasi terdokumentasi dan keputusan dan/atau surat penugasan yang berlaku."},Vn=[{kode:"M1",kelompok:"manajemen",nama:"Konteks, kepemimpinan, kebijakan, dan ruang lingkup",tujuan:"Menetapkan konteks, pemangku kepentingan, ruang lingkup, kebijakan, arah, dan akuntabilitas SMI.",pemilik:"Kepala BPSDMP; Sekretariat BPSDMP; Pimpinan Unit"},{kode:"M2",kelompok:"manajemen",nama:"Perencanaan, sasaran, risiko, peluang, dan perubahan",tujuan:"Menetapkan sasaran, program, risiko dan peluang, risiko penyuapan, pengendalian, serta rencana perubahan.",pemilik:"Kepala BPSDMP; Pimpinan Unit; Pemilik Proses; FKAP sesuai kewenangan"},{kode:"M3",kelompok:"manajemen",nama:"Tata kelola SMI, sumber daya, kompetensi, komunikasi, dan informasi terdokumentasi",tujuan:"Mengintegrasikan persyaratan SMI; menyediakan sumber daya; memastikan kompetensi/kepedulian; mengendalikan komunikasi dan informasi terdokumentasi; serta koordinasi lintas unit.",pemilik:"Kepala BPSDMP; Tim SMI BPSDMP; Sekretariat BPSDMP; Pimpinan Unit; Sekretariat Tim SMI sebagai dukungan administratif"},{kode:"M4",kelompok:"manajemen",nama:"Pemantauan, pengukuran, audit internal, Tinjauan Manajemen, dan tinjauan FKAP",tujuan:"Menilai pencapaian sasaran, kinerja proses, kepuasan, efektivitas pendidikan/pembelajaran, kepatuhan, efektivitas pengendalian, dan kecukupan SMI.",pemilik:"Kepala BPSDMP dan Pimpinan Unit sesuai kewenangan; Auditor Internal, FKAP, Tim SMI BPSDMP, dan Pemilik Proses sebagai pihak terkait sesuai fungsi masing-masing."},{kode:"M5",kelompok:"manajemen",nama:"Ketidaksesuaian, tindakan korektif, inovasi, dan peningkatan",tujuan:"Menangani ketidaksesuaian, akar penyebab, efektivitas tindakan, peluang peningkatan, inovasi, dan pemutakhiran sistem/proses.",pemilik:"Kepala BPSDMP; Pimpinan Unit; Pemilik Proses; Tim SMI BPSDMP"},{kode:"U1",kelompok:"utama",nama:"Analisis kebutuhan",tujuan:"Mengidentifikasi kebutuhan kompetensi, pendidikan, layanan, pasar kerja, organisasi, wilayah, peserta, dan pemangku kepentingan sebagai dasar program/layanan.",pemilik:"Unit pemilik/penyelenggara layanan sesuai kewenangan"},{kode:"U2",kelompok:"utama",nama:"Desain dan pengembangan program, kurikulum/silabus, pembelajaran, dan asesmen",tujuan:"Menerjemahkan kebutuhan menjadi program, kurikulum/silabus, modul, metode, media, kriteria, serta sistem evaluasi/asesmen yang disetujui dan dikendalikan perubahannya.",pemilik:"Unit penyelenggara; tim akademik/kurikulum; Pemilik Proses"},{kode:"U3",kelompok:"utama",nama:"Persyaratan layanan, promosi, seleksi, dan registrasi",tujuan:"Menetapkan dan mengomunikasikan persyaratan layanan; memastikan proses promosi, penerimaan, seleksi, registrasi, dan perlindungan data dilakukan transparan dan sesuai ketentuan.",pemilik:"Unit penyelenggara dan fungsi layanan/informasi terkait"},{kode:"U4",kelompok:"utama",nama:"Penyelenggaraan pendidikan, pelatihan, pembelajaran, dan layanan",tujuan:"Melaksanakan pendidikan/pelatihan/pembelajaran dan layanan dalam kondisi terkendali, inklusif, aman, serta sesuai kurikulum, standar akademik, standar pelayanan, atau ketentuan program.",pemilik:"Unit penyelenggara sebagai pemilik proses; pengajar/widyaiswara/narasumber dan penyedia eksternal sebagai pelaksana terkendali"},{kode:"U5",kelompok:"utama",nama:"Ujian, asesmen, penilaian kompetensi, dan RPL",tujuan:"Melaksanakan evaluasi hasil pembelajaran/kompetensi secara valid, objektif, adil, aman, dapat ditelusuri, dan bebas benturan kepentingan; termasuk RPL apabila ditetapkan sesuai ketentuan.",pemilik:"Unit penyelenggara sesuai kewenangan; Pusbin JF/Pusbangkom/Akmet sesuai proses; asesor/penguji sebagai pelaksana terkendali"},{kode:"U6",kelompok:"utama",nama:"Verifikasi, pelepasan hasil, penerbitan sertifikat/dokumen hasil, dan kelulusan",tujuan:"Memastikan hasil memenuhi kriteria, diverifikasi, disahkan oleh pejabat berwenang, diterbitkan/ditetapkan tepat waktu, dan dikendalikan rekamannya.",pemilik:"Unit/pejabat berwenang sesuai produk dan layanan"},{kode:"U7",kelompok:"utama",nama:"Pascapelayanan, pembinaan, evaluasi efektivitas, alumni, manfaat dan dampak",tujuan:"Menindaklanjuti hasil layanan, memantau kepuasan, penerapan kompetensi, alumni/tracer study, manfaat, dampak, keluhan, dan rekomendasi peningkatan.",pemilik:"Unit penyelenggara dan Pemilik Proses"},{kode:"U8A",kelompok:"utama",nama:"Pembinaan Jabatan Fungsional dan layanan terkait",tujuan:"Mengelola kebijakan teknis, standar kompetensi, rekomendasi formasi, akreditasi pelaksanaan uji kompetensi, penilaian kompetensi nonmanajerial, pembinaan profesi, konsultasi dan layanan informasi sesuai kewenangan.",pemilik:"Pusat Pembinaan Jabatan Fungsional Perdagangan"},{kode:"U8B",kelompok:"utama",nama:"Pendidikan vokasi, penelitian, pengabdian kepada masyarakat, dan penjaminan mutu pendidikan",tujuan:"Mengelola penyelenggaraan pendidikan vokasi, penelitian/pengabdian, penjaminan mutu, layanan akademik/kemahasiswaan, pemagangan, kerja sama, alumni, dan dukungan akademik sesuai ketentuan.",pemilik:"Akademi Metrologi dan Instrumentasi"},{kode:"U8C",kelompok:"utama",nama:"Pendampingan, konsultasi, kerja sama, publikasi, dan layanan informasi",tujuan:"Mengelola layanan khusus lintas unit yang tidak selalu mengikuti urutan pembelajaran formal, tetapi tetap dikendalikan persyaratan, risiko, keluaran, evaluasi, dan rekamannya.",pemilik:"PPEJP, Pusbangkom, Bapekomdag, Pusbin JF, dan unit relevan sesuai kewenangan"},{kode:"P1",kelompok:"pendukung",nama:"Perencanaan, anggaran, keuangan, dan pelaporan",tujuan:"Menyediakan dukungan perencanaan, anggaran, pengelolaan keuangan, pemantauan realisasi, dan pelaporan untuk keberlangsungan proses SMI.",pemilik:"Sekretariat BPSDMP dan fungsi/unit terkait pada masing-masing unit kerja"},{kode:"P2",kelompok:"pendukung",nama:"SDM, kompetensi, penugasan, kepedulian, dan budaya organisasi",tujuan:"Memastikan kecukupan personel, kompetensi, penugasan, pengembangan, kepedulian SMI/anti penyuapan, dan budaya mutu/integritas.",pemilik:"Sekretariat BPSDMP dan fungsi SDM/unit terkait"},{kode:"P3",kelompok:"pendukung",nama:"Pengadaan, penyedia eksternal, uji kelayakan, dan kerja sama",tujuan:"Mengendalikan kebutuhan, pengadaan, penyedia eksternal/rekan bisnis, uji kelayakan bila relevan, komitmen anti penyuapan, kontrak/kerja sama, evaluasi, dan penerimaan hasil.",pemilik:"Fungsi pengadaan/kerja sama dan Pemilik Proses; FKAP memberi masukan sesuai risiko anti penyuapan"},{kode:"P4",kelompok:"pendukung",nama:"BMN, infrastruktur, lingkungan pembelajaran, laboratorium/workshop, dan keselamatan",tujuan:"Menyediakan dan memelihara sarana, prasarana, BMN, lingkungan belajar/kerja, laboratorium/workshop, peralatan, serta aspek keselamatan yang relevan.",pemilik:"Sekretariat BPSDMP dan unit pemilik sarana/fasilitas"},{kode:"P5",kelompok:"pendukung",nama:"TI/LMS, data, keamanan informasi, dokumen, dan arsip",tujuan:"Menjamin ketersediaan dan pengendalian sistem digital, LMS, data, akses, keamanan informasi, informasi terdokumentasi, retensi, dan kearsipan.",pemilik:"Sekretariat BPSDMP dan fungsi TI/data/kearsipan; unit pemilik sistem"},{kode:"P6",kelompok:"pendukung",nama:"Hukum, komunikasi publik, administrasi umum, SPIP, dan kepatuhan internal",tujuan:"Menyediakan dukungan hukum, komunikasi publik, administrasi, SPIP, kepatuhan internal, dan layanan kesekretariatan lainnya. FKAP tidak ditempatkan sebagai proses pendukung, melainkan fungsi pengendalian lintas proses.",pemilik:"Sekretariat BPSDMP dan fungsi/unit terkait"}],Ci=[["Masukan eksternal dan internal","Mandat, regulasi, kebutuhan, data, isu, risiko dan peluang","M1 - Konteks dan arah","Analisis konteks; matriks pemangku kepentingan; register persyaratan"],["M1 - Konteks dan arah","Kebijakan, ruang lingkup, prioritas, kebutuhan/harapan, dan persyaratan relevan","M2 - Perencanaan","Kebijakan SMI; pernyataan ruang lingkup; keputusan pimpinan; data konteks"],["M2 - Perencanaan","Sasaran, program, rencana pengendalian, sumber daya, risiko, peluang, dan rencana perubahan","M3, U1-U8C, P1-P6","Dokumen sasaran; rencana kerja; register risiko/risiko penyuapan; rencana perubahan"],["M3 - Tata kelola dan dukungan","Sumber daya, kompetensi, komunikasi, informasi terdokumentasi, dan koordinasi","U1-U8C, P1-P6","Penugasan; matriks kompetensi; komunikasi; daftar induk dokumen; bukti sumber daya"],["U1 - Analisis kebutuhan","Peta kebutuhan dan rekomendasi program/layanan","U2 - Desain","Laporan analisis kebutuhan; data dasar; hasil validasi"],["U2 - Desain","Program, kurikulum/silabus, modul, metode, media, kriteria dan asesmen","U3 dan U4","Dokumen desain yang disahkan; rekaman perubahan; persetujuan"],["U3 - Persyaratan/seleksi/registrasi","Peserta/mahasiswa/pemohon terverifikasi dan informasi layanan yang telah dikomunikasikan","U4 - Pelaksanaan","Daftar peserta; bukti persyaratan; persetujuan; data registrasi"],["P1-P6 - Pendukung","SDM, anggaran, fasilitas, sistem, bahan, penyedia, dokumen dan dukungan lain","M1-M5 dan U1-U8C","Rencana sumber daya; kontrak/kerja sama; jadwal; bukti kompetensi; kesiapan sarana"],["U4 - Pelaksanaan","Bukti keikutsertaan, hasil proses belajar/layanan, tugas, dan data kinerja","U5 - Penilaian","Presensi; jurnal/log LMS; berita acara; portofolio; rekaman layanan"],["U5 - Penilaian/RPL","Nilai, hasil kompetensi, rekomendasi kelulusan, keputusan RPL atau hasil penilaian","U6 - Verifikasi/pelepasan hasil","Rekap nilai; lembar verifikasi; berita acara; keputusan penguji/asesor"],["U6 - Verifikasi/pelepasan hasil","Sertifikat pelatihan, surat hasil, SKL/SPTL, ijazah/transkrip, rekomendasi, atau dokumen resmi lainnya","U7 dan penerima hasil","Register penerbitan; bukti otorisasi; bukti penyerahan; arsip"],["U7 - Pascapelayanan","Data kepuasan, penerapan kompetensi, alumni/tracer, manfaat, dampak, keluhan dan rekomendasi","M4 - Evaluasi","Survei; tracer study; evaluasi pascapelatihan; laporan tindak lanjut"],["U8A-U8C - Proses khusus","Kebijakan teknis, rekomendasi, hasil penelitian/pengabdian, pendampingan, konsultasi, kerja sama, publikasi dan informasi","U5-U7, M4, dan pemangku kepentingan sesuai relevansi","Dokumen teknis; laporan; publikasi; berita acara; rekomendasi; rekaman layanan"],["Seluruh proses","KPI, keluhan, ketidaksesuaian, insiden, risiko/peluang, dugaan penyuapan, kinerja penyedia, dan data pendidikan/pembelajaran","M4 - Evaluasi","Dashboard/laporan kinerja; audit; pengaduan; register risiko/kepatuhan; evaluasi pembelajaran"],["M4 - Evaluasi","Temuan, tren, hasil audit, hasil tinjauan FKAP, hasil Tinjauan Manajemen, dan peluang peningkatan","M5 - Peningkatan","Laporan audit; notulen Tinjauan Manajemen; tinjauan FKAP; analisis data"],["M5 - Peningkatan","Koreksi, tindakan korektif, inovasi, perubahan dokumen/proses, dan pembelajaran organisasi","M1-M3, U1-U8C, P1-P6 sesuai relevansi","Rencana tindakan; bukti verifikasi efektivitas; dokumen revisi; praktik baik"],["Pengguna/peserta/ penerima manfaat","Umpan balik, pengaduan, banding, perubahan kebutuhan, kekhawatiran, dan informasi baru","U1\u2013U8C, M1, M4, dan FKAP sesuai relevansi","Rekaman komunikasi; tindak lanjut pengaduan/banding; rekaman pelaporan kekhawatiran"]],Us=["Setiap proses memiliki Pemilik Proses yang bertanggung jawab atas pencapaian tujuan proses, pemenuhan persyaratan, pengendalian risiko dan peluang, pemantauan kinerja, informasi terdokumentasi, serta peningkatan proses.","Interaksi dan serah terima antarproses maupun antarunit dilaksanakan dengan memastikan kejelasan input, keluaran, kriteria penerimaan, tanggung jawab, batas waktu, media/sistem yang digunakan, dan bukti pelaksanaannya.","Proses yang melibatkan keputusan berisiko atau sensitif, antara lain seleksi, ujian, asesmen, kelulusan, penerbitan sertifikat atau dokumen hasil, rekomendasi, pengadaan, pembayaran, dan kerja sama, menerapkan pemisahan fungsi, verifikasi, pengelolaan benturan kepentingan, dan pengendalian anti penyuapan yang proporsional.","Fungsi Kepatuhan Anti Penyuapan (FKAP) menjalankan fungsi pengendalian lintas proses sesuai kewenangannya dan tidak diposisikan sebagai pemilik proses pendukung P1\u2013P6.","Proses yang dilaksanakan oleh penyedia eksternal tetap berada dalam pengendalian BPSDMP melalui penetapan persyaratan, evaluasi penyedia, uji kelayakan apabila relevan, pemantauan kinerja, verifikasi hasil, serta pengendalian risiko dan anti penyuapan sesuai tingkat risikonya.","Perubahan suatu proses harus mempertimbangkan dampaknya terhadap proses lain, pengguna/peserta, sumber daya, risiko dan peluang, risiko penyuapan, informasi terdokumentasi, sistem digital, sasaran SMI, serta persyaratan pendidikan dan pembelajaran. Peta proses dan interaksi proses ditinjau secara berkala dan diperbarui apabila terdapat perubahan yang memengaruhi kesesuaian atau efektivitas SMI."],Os="Peta ini merupakan peta proses internal SMI dan tidak menggantikan Peta Proses Bisnis Instansi Pemerintah yang ditetapkan sesuai ketentuan peraturan perundang-undangan.";x();var Zl=[["Jenis entri","R = risiko umum/pendidikan/mutu/kepatuhan; RP = risiko penyuapan; OP = peluang.","Kode membedakan karakter risiko tanpa memisahkan dokumen."],["Kemungkinan (K)","Skala mengikuti metodologi risiko BPSDMP yang disahkan.","Untuk RP pertimbangkan paparan, frekuensi interaksi, nilai/manfaat, diskresi keputusan, pihak ketiga, lokasi, riwayat dan kemudahan modus."],["Dampak (D)","Gunakan dampak tertinggi yang relevan: layanan, pendidikan, kepatuhan, keuangan, keselamatan, data, reputasi, sasaran.","Untuk RP juga pertimbangkan dampak hukum, integritas keputusan, sanksi, tanggung jawab organisasi, dan kepercayaan publik."],["Level/Prioritas","Mengikuti matriks risiko BPSDMP yang berlaku.","Kriteria tingkat risiko penyuapan ditetapkan konsisten dengan kebijakan/sasaran dan digunakan untuk menentukan kontrol yang wajar serta proporsional."],["Efektivitas kontrol","Efektif / Parsial / Tidak Efektif / BD berdasarkan bukti.","Untuk RP, efektivitas tidak cukup dinyatakan hanya dari adanya SOP/pakta; harus mempertimbangkan penerapan, pemisahan tugas, uji kelayakan, audit trail, pelaporan dan verifikasi."],["Risiko residu","Dinilai setelah pengendalian yang ada/tambahan diterapkan.","RP residu menjadi dasar perlu/tidaknya due diligence lebih lanjut, kontrol tambahan, eskalasi atau review FKAP."],["Status tindakan","Rencana / Sedang Dilaksanakan / Tuntas / BD.","Tuntas hanya setelah bukti tersedia dan efektivitas diverifikasi."],["Evaluasi peluang","Peluang dinilai berdasarkan manfaat yang diharapkan, relevansi terhadap sasaran SMI, urgensi, kelayakan, kebutuhan sumber daya, dan risiko penerapannya untuk menentukan prioritas tindak lanjut.","\u2014"]],Ge=(e,t,i,l,r,s)=>({kode:e,jenis:"R",area:t,uraian:i,relevansi:l,pemilik:r,pengendalian:s,penilaian:"BD",status:"Rencana"}),ti=[Ge("R-01","Tata kelola & integrasi SMI","Pembagian peran, antarmuka, pemilik proses atau eskalasi belum jelas akibat konsolidasi 10 unit. Dampak: tumpang tindih/kekosongan kontrol, keterlambatan, temuan berulang.","Mutu/AP/OP","Kepala BPSDMP; Tim SMI; Sekretariat BPSDMP","Peta proses, RACI, pemilik proses, forum koordinasi, SOP lintas unit, eskalasi."),Ge("R-02","Konsistensi mutu antarunit/lokasi","Standar, kompetensi, fasilitas dan praktik berbeda sehingga mutu layanan/pembelajaran/asesmen tidak seragam.","Mutu/OP","Pimpinan unit; Tim SMI","Kriteria layanan seragam, audit silang, benchmarking, dashboard unit."),Ge("R-03","Kompetensi, kapasitas & ketergantungan personel","Kesenjangan kompetensi, beban tidak merata, mutasi/pensiun atau ketergantungan pada personel tertentu mengganggu proses.","Mutu/AP/OP","Sekretariat BPSDMP; pimpinan unit","Matriks kompetensi, TNA, redistribusi, suksesi, dokumentasi pengetahuan."),Ge("R-04","Data, sistem digital & informasi terdokumentasi","Data kinerja/hasil, LMS/aplikasi, dokumen atau rekaman tidak lengkap, tidak aman, terlambat, berubah tanpa wewenang, hilang atau bocor.","Mutu/AP/OP","Pemilik data/proses; Sekretariat BPSDMP","Kamus data, validasi, kontrol akses, audit trail, backup, retensi, uji pemulihan."),Ge("R-05","Desain program, kurikulum & perubahan","Analisis kebutuhan, validasi, pelibatan pengguna atau kendali perubahan tidak memadai sehingga program/kurikulum tidak relevan.","Mutu/OP","Pusat/UPT/Akmet pemilik program","Analisis kebutuhan, desain berbasis kompetensi, validasi, kendali versi, review hasil."),Ge("R-06","Objektivitas asesmen, ujian & keputusan layanan","Kriteria, independensi, moderasi atau pengamanan instrumen tidak memadai sehingga hasil seleksi/asesmen/kelulusan tidak objektif.","Mutu/AP/OP","Unit penyelenggara; Pusbin JF; Akmet","Kriteria kompetensi, pemisahan tugas, moderasi, deklarasi kepentingan, pengamanan soal, banding."),Ge("R-07","Sarana, laboratorium, aksesibilitas & keselamatan","Fasilitas, alat praktik, jaringan atau akomodasi tidak memadai/aman/aksesibel.","Mutu/OP","Sekretariat BPSDMP; UPT/Akmet","Pemetaan kebutuhan, inspeksi, pemeliharaan/kalibrasi, alternatif fasilitas, akomodasi layak."),Ge("R-08","Kepatuhan regulasi & persyaratan lain","Perubahan regulasi, standar, kontrak atau persyaratan layanan tidak teridentifikasi/diterapkan tepat waktu.","Mutu/AP/OP","Sekretariat BPSDMP; pemilik kepatuhan","Register persyaratan, pemantauan JDIH, analisis dampak, sosialisasi, evaluasi bukti."),Ge("R-09","Penyedia eksternal & mitra","Penyedia/mitra tidak memenuhi mutu, pendidikan, integritas, waktu, keamanan, HKI atau perlindungan data.","Mutu/AP/OP","PPK/pemilik kontrak/kerja sama","Kriteria seleksi, SLA/kontrak, due diligence sesuai risiko, evaluasi, verifikasi hasil."),Ge("R-10","Anggaran & perubahan prioritas","Efisiensi/realokasi anggaran, biaya meningkat atau perubahan kebijakan menghambat program dan pengendalian SMI.","Mutu/AP/OP","Kepala BPSDMP; Sekretariat; pimpinan unit","Prioritas berbasis risiko, alternatif metode, kolaborasi, pengendalian perubahan."),Ge("R-11","Perubahan iklim, bencana & kesinambungan layanan","Cuaca ekstrem, bencana, gangguan transportasi/lingkungan atau kedaruratan menghambat layanan dan keselamatan.","Mutu/OP","Sekretariat BPSDMP; pimpinan lokasi","Business continuity, peringatan dini, alternatif daring/hybrid, prosedur darurat, pengamanan aset/data."),Ge("R-12","Keluhan, audit & efektivitas perbaikan","Keluhan/banding, temuan audit atau tindakan korektif terlambat, tidak objektif, atau berulang. Dampak: sengketa, temuan berulang dan reputasi turun.","Mutu/AP/OP","Tim SMI; auditor internal; unit layanan; FKAP sesuai isu","Kanal terintegrasi, SLA, audit berbasis risiko, analisis akar masalah, verifikasi efektivitas dan eskalasi.")],Gn=(e,t,i,l,r,s)=>({kode:e,jenis:"RP",area:t,uraian:i,relevansi:"AP",kerentanan:l,pengendalian:r,pemilik:s,penilaian:"BD",status:"BD"}),Li=[Gn("RP-01","Tata kelola & independensi FKAP","Pengawasan anti penyuapan tidak memadai atau FKAP tidak memperoleh kompetensi, sumber daya, informasi dan akses langsung yang diperlukan.","Peran/rangkap tugas tidak jelas; intervensi; akses data terbatas. Dampak: pengawasan tidak objektif, kelemahan kontrol tidak tertangani.","Penetapan peran; akses langsung; asesmen kompetensi; deklarasi benturan; laporan FKAP; review sumber daya.","Kepala BPSDMP/FKAP"),Gn("RP-02","Hadiah, gratifikasi & benturan kepentingan","Personel meminta/menerima/menawarkan manfaat atau menyembunyikan hubungan untuk memengaruhi peserta, pegawai, penyedia, nilai, kelulusan, rekomendasi atau layanan.","Budaya hadiah; deklarasi tidak rutin; aturan pengalihan kewenangan/penggantian pengambil keputusan lemah. Dampak: favoritisme, kolusi, keputusan tidak objektif, sanksi.","Aturan hadiah/jamuan; register; deklarasi sebelum keputusan sensitif; verifikasi; pengalihan kewenangan; uji petik.","Pimpinan unit/UPG/FKAP"),Gn("RP-03","Pelaporan kekhawatiran & investigasi","Laporan dibocorkan/dihambat/dibalas atau dugaan penyuapan tidak diinvestigasi secara objektif, rahasia dan tepat waktu.","Kanal/SLA tidak jelas; konflik penangan; pengamanan bukti lemah. Dampak: penyuapan tidak terdeteksi, bukti hilang, retaliasi.","Kanal aman; pembatasan akses; anti-retaliasi; triase; penangan independen; pengamanan dan rantai penguasaan bukti (chain of custody); eskalasi.","FKAP/pejabat berwenang/Inspektorat"),Gn("RP-04","Rekan bisnis, penyedia & kerja sama","Penyedia, instruktur, asesor, konsultan, mitra atau perantara menawarkan/menerima suap untuk pemilihan, pembayaran, akses, promosi atau perlakuan khusus.","Uji kelayakan tidak proporsional; klausul kontrak/pengawasan lemah. Dampak: kerugian, tanggung jawab organisasi, reputasi.","Due diligence berbasis risiko; klausul anti penyuapan; hak audit; deklarasi manfaat; evaluasi berkala.","PPK/pemilik kerja sama/FKAP"),Gn("RP-05","Keputusan sensitif & delegasi kewenangan","Kewenangan pada seleksi, RPL, ujian, asesmen, kelulusan, sertifikat, formasi, beasiswa, pembayaran atau pengadaan disalahgunakan untuk manfaat pribadi/pihak lain.","Diskresi tinggi; keputusan individual; maker-checker tidak memadai. Dampak: hasil tidak sah, kerugian, ketidakadilan.","Peta keputusan sensitif; batas delegasi; pemisahan tugas; panel/moderasi; dual approval; rotasi; audit trail.","Pimpinan unit/pemilik proses/FKAP"),Gn("RP-06","Data, dokumen & jejak audit","Nilai, soal, hasil asesmen, sertifikat, rekomendasi, tagihan atau bukti diubah/dihilangkan untuk memberi keuntungan atau menutupi penyuapan.","Hak akses berlebih; log/rekonsiliasi/retensi lemah. Dampak: bukti investigasi hilang, hasil tidak valid, kebocoran data.","Role-based access; audit trail; rekonsiliasi; backup; dual approval; review log dan anomali.","Pemilik data/proses; Sekretariat BPSDMP"),Gn("RP-07","Tekanan target & perubahan organisasi/sistem","Tekanan kelulusan, kinerja, serapan anggaran atau perubahan struktur/digitalisasi membuka celah dan mendorong toleransi penyimpangan.","Target tidak seimbang; kontrol lama tidak relevan; transfer pengetahuan lemah. Dampak: manipulasi dan celah kewenangan.","Review risiko sasaran; indikator integritas; penilaian risiko sebelum perubahan; review akses; verifikasi pascaimplementasi.","Kepala BPSDMP/Tim SMI/FKAP/pemilik perubahan"),Gn("RP-08","Sponsorship, sumbangan & manfaat serupa","Sponsorship, bantuan, perjalanan, diskon atau dukungan kegiatan digunakan sebagai sarana memengaruhi keputusan atau memperoleh akses khusus.","Kriteria penerimaan/pemberian, transparansi dan persetujuan belum jelas. Dampak: konflik kepentingan dan reputasi.","Kebijakan/kriteria; due diligence; persetujuan; pembatasan; pencatatan/register; transparansi.","Sekretariat BPSDMP/pemilik kegiatan/FKAP")],Dn=[["OP-01","Integrasi & penyederhanaan proses","Konsolidasi 10 unit dapat mengurangi duplikasi dan memperjelas antarmuka.","Peta proses, RACI, SOP lintas unit, forum pemilik proses, satu dashboard.","Kepala BPSDMP; Tim SMI; Sekretariat BPSDMP","Proses/SOP terintegrasi; waktu siklus; duplikasi menurun","Des 2026"],["OP-02","Pemerataan akses melalui jaringan wilayah & hybrid","Tiga Bapekomdag dan sarana daring memperluas jangkauan dan efisiensi.","Kalender bersama, kelas hybrid, pemanfaatan fasilitas lintas unit, standar mutu seragam.","Bapekomdag; pusat teknis","Cakupan wilayah/peserta; utilisasi hybrid; kesenjangan mutu","Des 2026"],["OP-03","Standardisasi kompetensi pengajar/asesor/penguji/personel SMI","Mengurangi ketergantungan dan meningkatkan konsistensi.","Matriks kompetensi, workshop, komunitas praktik, moderasi, coaching, personel cadangan.","Sekretariat BPSDMP; seluruh unit; Pusbin JF","Kompetensi terpenuhi; evaluasi pengajar/asesor; cadangan tersedia","Des 2026"],["OP-04","Dashboard kinerja, risiko & kepatuhan terpadu","Integrasi data mempercepat keputusan berbasis bukti.","Kamus data, integrasi sumber, validasi, dashboard dan rapat tren.","Sekretariat BPSDMP; pemilik data","Ketepatan/kelengkapan data; penggunaan dashboard; waktu tindak lanjut","Des 2026"],["OP-05","Digitalisasi & personalisasi pembelajaran","LMS, konten digital dan analitik dapat meningkatkan skala/pengalaman belajar.","Penguatan LMS, konten aksesibel, analitik belajar, backup, evaluasi efektivitas.","Unit penyelenggara; PDSI sesuai kewenangan","Utilisasi LMS; penyelesaian; kepuasan; insiden layanan/data","Des 2026"],["OP-06","Pemanfaatan bersama laboratorium/fasilitas/alat","Koordinasi lintas unit dan mitra dapat menutup kesenjangan fasilitas.","Inventaris kapasitas, kalender pemanfaatan, kerja sama, pemeliharaan/kalibrasi bersama.","UPT/Akmet; Sekretariat BPSDMP","Jam pemanfaatan; ketersediaan alat; hasil evaluasi praktik","Des 2026"],["OP-07","Pembaruan kurikulum/program berbasis kebutuhan dunia kerja","Kebutuhan pengguna dan perubahan kompetensi membuka program baru dan peningkatan relevansi.","Tracer study, analisis kebutuhan, review kurikulum, program baru, kemitraan industri.","Pusat teknis; Akmet; UPT","Program diperbarui; daya serap; kepuasan pengguna; hasil belajar","Des 2026"],["OP-08","Budaya integritas, transparansi & kepercayaan","Penerapan ISO 37001:2025 dapat memperkuat objektivitas layanan dan kepercayaan.","Penilaian risiko penyuapan, deklarasi, due diligence, pelatihan, kanal pelaporan, review FKAP.","Kepala BPSDMP; FKAP; pimpinan unit","Cakupan pelatihan; laporan ditindaklanjuti; efektivitas kontrol; survei integritas","Des 2026"]],Ql=[["Review register unit","Pemilik risiko/pimpinan unit","Sekurang-kurangnya triwulanan dan saat terdapat perubahan signifikan, insiden, atau sesuai kebutuhan siklus proses.","Status tindakan, bukti kontrol, nilai residu, kebutuhan sumber daya"],["Konsolidasi tingkat Badan","Tim SMI BPSDMP","Sekurang-kurangnya semesteran","Profil risiko lintas SMI, tren, prioritas dan rekomendasi"],["Review risiko penyuapan","FKAP bersama pemilik risiko","Berkala sesuai metodologi dan pada perubahan signifikan","Profil risiko penyuapan, efektivitas kontrol, kebutuhan due diligence/kontrol tambahan"],["Audit/Verifikasi","Auditor Internal/FKAP sesuai kewenangan","Sesuai program audit dan berbasis risiko","Bukti efektivitas, temuan, tindakan korektif"],["Tinjauan Manajemen","Kepala BPSDMP dan pimpinan terkait","Sekurang-kurangnya tahunan","Keputusan risiko, sumber daya, sasaran, pengendalian dan peningkatan"]],Xl=[["Jenis","Aktual","Kepentingan pribadi berhadapan langsung dengan keputusan/tindakan yang akan atau sedang dilakukan.","Deklarasi; hentikan sementara keterlibatan; keputusan atasan; pengalihan/pembatasan."],["Jenis","Potensial","Kepentingan pribadi dapat memengaruhi tugas/keputusan tertentu.","Pencatatan kepentingan; analisis tugas; pembatasan preventif."],["Sumber","Bisnis/finansial","Saham, aset, investasi, pemilik manfaat, pekerjaan/usaha atau manfaat ekonomi.","Deklarasi; pengalihan kewenangan; pelepasan kepentingan bila perlu; uji kelayakan sesuai risiko."],["Sumber","Keluarga/kerabat","Hubungan keluarga/kerabat yang dapat memengaruhi objektivitas.","Deklarasi; penggantian penilai/penguji; panel; pengawasan tambahan."],["Sumber","Afiliasi","Mantan atasan/bawahan/rekan, hubungan istimewa, organisasi/yayasan/lembaga.","Deklarasi; pembatasan akses; peer review; keputusan kolegial."],["Sumber","Pekerjaan luar/rangkap jabatan","Kegiatan/jabatan lain yang berbenturan dengan tugas, waktu, informasi atau keputusan.","Izin; analisis kompatibilitas; pembatasan tugas/akses; penghentian bila tidak dapat dikelola."],["Sumber","Revolving door","Relasi jabatan lama/mantan pejabat yang berpotensi memengaruhi keputusan.","Masa tunggu apabila dipersyaratkan ketentuan; larangan perlakuan istimewa; uji kelayakan; alih kewenangan."],["Sumber","Hadiah/gratifikasi","Pemberian/manfaat yang dapat memengaruhi netralitas keputusan.","Tolak/kembalikan/laporkan; deklarasi benturan kepentingan; alihkan keputusan."]],Ti=[["KK-01","Perumusan kebijakan/keputusan strategis","Bisnis/finansial; afiliasi","Pejabat memiliki kepentingan pada pihak yang memperoleh manfaat.","Prioritas program, alokasi sumber daya, penerima manfaat.","Deklarasi; keluarkan dari pembahasan/akses; alihkan kewenangan atau keputusan kolegial; risalah/keputusan.","Kepala BPSDMP/atasan"],["KK-02","Penunjukan tim/panitia/asesor/penguji/pengajar/narasumber","Keluarga/kerabat; afiliasi","Pejabat menunjuk/menilai pihak yang memiliki hubungan pribadi/kerja.","Penunjukan, honor, penilaian, perpanjangan tugas.","Deklarasi; verifikasi hubungan; panel; ganti penilai/pejabat; berita acara/SK.","Pimpinan unit/atasan"],["KK-03","Pengadaan barang/jasa dan penyedia","Bisnis/finansial; keluarga; afiliasi; hadiah","Personel pengadaan memiliki hubungan/manfaat dari penyedia.","Spesifikasi, pemilihan, evaluasi, penerimaan, pembayaran, sanksi.","Deklarasi per paket; ganti personel; evaluasi kolegial; pembatasan akses; pengawasan; dokumen pemilihan/BA.","PPK/pejabat pengadaan"],["KK-04","Keuangan, perjalanan dinas, honorarium, pembayaran","Bisnis/finansial; keluarga/afiliasi","Pejabat memproses/menyetujui transaksi yang menguntungkan dirinya/pihak terkait.","Persetujuan, verifikasi, pembayaran, pertanggungjawaban.","Alihkan persetujuan; verifikasi independen; uji transaksi; log/checklist sebelum pencairan.","KPA/PPK/atasan"],["KK-05","Kepegawaian dan pengembangan karier","Keluarga/kerabat; afiliasi; pekerjaan luar","Pejabat menangani seleksi, penilaian, promosi, mutasi/disiplin pihak terkait.","Nilai, rekomendasi, promosi, mutasi, pelatihan.","Deklarasi; ganti penilai; panel independen; review; berita acara sebelum keputusan.","Pimpinan/pengelola SDM"],["KK-06","Kerja sama, kemitraan, hibah, sponsor","Afiliasi; bisnis/finansial; hadiah","Pejabat memiliki hubungan dengan mitra/sponsor/penerima kerja sama.","Pemilihan mitra, ruang lingkup, kontribusi/manfaat.","Uji kelayakan (due diligence) sesuai tingkat risiko penyuapan; deklarasi; review hukum/keuangan; persetujuan independen; perjanjian.","Pemilik kerja sama/atasan"],["KK-07","Data, informasi, soal, nilai, hasil layanan","Afiliasi; finansial; penggunaan informasi","Personel memanfaatkan akses untuk diri/pihak terkait.","Akses, perubahan data, pelepasan hasil/informasi.","Role-based access; deklarasi; dual control; audit log; investigasi anomali.","Pemilik sistem/proses"],["KK-08","Aset, fasilitas, kendaraan, sumber daya","Kepentingan pribadi; afiliasi","Penggunaan aset/sumber daya untuk kepentingan pribadi/afiliasi.","Izin penggunaan, peminjaman, penjadwalan, biaya.","Tolak penggunaan di luar tugas; alih persetujuan; catat insiden; log BMN/BA.","Pengelola BMN/atasan"],["KK-09","Hadiah, jamuan, fasilitas, gratifikasi","Hadiah/gratifikasi","Manfaat dapat memengaruhi netralitas keputusan.","Penilaian, pemilihan, pembayaran, akses.","Tolak/kembalikan/laporkan; deklarasi benturan kepentingan; ali ifikasi dan pembaruan register."]],eo=[["Kebijakan/petunjuk dan penugasan pengelola tersedia dan mutakhir.","Tersedia/mutakhir","Tahunan/perubahan"],["Proses sensitif dan skenario benturan kepentingan terpetakan.","100% proses sensitif","Tahunan/perubahan proses"],["Kepatuhan daftar kepentingan dan deklarasi aktual.","100% pihak yang diwajibkan; 100% deklarasi ditindaklanjuti","Tahunan/setiap kasus"],["Pelatihan/sosialisasi/konsultasi dilaksanakan sesuai risiko.","Sesuai kelompok sasaran","Tahunan/pegawai baru"],["Pengaduan/dugaan pelanggaran ditangani aman, rahasia, sesuai SLA.","100% sesuai ketentuan/SLA","Setiap kasus"],["Efektivitas pengendalian dan tren kasus dievaluasi serta dilaporkan.","Kontrol efektif; laporan minimal tahunan","Semester/tahunan"]],no=[["Kepala BPSDMP/Pimpinan Unit","Memastikan komitmen, sumber daya, penerapan dan tindak lanjut isu material.","Tidak menangani kasus yang melibatkan dirinya; eskalasi ke pejabat berwenang."],["Atasan Pejabat","Menerima deklarasi, menganalisis dan menetapkan pengendalian; untuk pengendalian internal ditetapkan paling lama 7 hari kerja.","Keputusan objektif, terdokumentasi dan bebas benturan kepentingan."],["Pejabat/Pegawai","Mencatat kepentingan, mendeklarasikan benturan aktual, menghentikan keterlibatan dan mematuhi pengendalian.","Tidak memengaruhi proses setelah kewenangan dialihkan/dibatasi."],["Unit Pengawasan Internal/Pejabat Pengelola","Mendukung pencatatan, pengawasan, pengaduan, konsultasi dan monev sesuai mandat.","Menjaga kerahasiaan, objektivitas dan independensi."],["FKAP BPSDMP","Mendukung koordinasi, edukasi, pemetaan risiko penyuapan, konsultasi SMI dan eskalasi isu anti penyuapan.","Tidak menggantikan kewenangan atasan, APIP, UPG, pemeriksa disiplin atau penegak hukum."],["Pemilik Proses","Memastikan kontrol preventif, pemisahan tugas, panel, log dan bukti diterapkan.","Tidak menetapkan sendiri penyelesaian kasus yang melibatkan dirinya."]],Ei="Bidang Kepatuhan, Integritas, dan Anti Penyuapan pa
